name: Sauvegarde Turso

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Exporter l'état Turso
        run: npm run db:backup
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Conserver la sauvegarde 30 jours
        uses: actions/upload-artifact@v4
        with:
          name: loutigui-backup-${{ github.run_id }}
          path: backups/*.json
          retention-days: 30
          if-no-files-found: error
